name: demo

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test application
        run: pnpm lint && pnpm test

      - name: Test demo contracts
        run: pnpm test:demo

      - name: Build and scan static demo
        run: pnpm demo:check

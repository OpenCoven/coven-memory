name: Release npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-tag:
    name: Verify signed release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          fetch-depth: 0

      - name: Confirm tag signature, version, and main ancestry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_RELEASE_ALLOWED_SIGNERS: ${{ vars.NPM_RELEASE_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_OBJECT_SHA="$(git rev-parse "$TAG_NAME")"

          if [ "$(git cat-file -t "$TAG_OBJECT_SHA")" != "tag" ]; then
            echo "::error::Refusing release: $TAG_NAME is not an annotated signed tag."
            exit 1
          fi

          payload="$(gh api "/repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          if [ "$(jq -r '.verification.verified' <<<"$payload")" != "true" ]; then
            reason="$(jq -r '.verification.reason' <<<"$payload")"
            echo "::error::GitHub did not verify $TAG_NAME (reason=$reason)."
            exit 1
          fi

          TAGGED_COMMIT_SHA="$(jq -r '.object.sha // ""' <<<"$payload")"
          if [ "$(jq -r '.object.type // ""' <<<"$payload")" != "commit" ] ||
             [ -z "$TAGGED_COMMIT_SHA" ]; then
            echo "::error::Refusing release: $TAG_NAME does not target a commit."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "v$package_version" ]; then
            echo "::error::Tag $TAG_NAME does not match package version $package_version."
            exit 1
          fi

          if [ -z "${NPM_RELEASE_ALLOWED_SIGNERS//[[:space:]]/}" ]; then
            echo "::error::NPM_RELEASE_ALLOWED_SIGNERS is not configured."
            exit 1
          fi
          allowed_signers_file="$RUNNER_TEMP/npm-release-allowed-signers"
          printf '%s\n' "$NPM_RELEASE_ALLOWED_SIGNERS" > "$allowed_signers_file"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$allowed_signers_file"
          git verify-tag "$TAG_NAME"

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT_SHA" origin/main; then
            echo "::error::Tagged commit is not contained in origin/main."
            exit 1
          fi

  verify-package:
    name: Verify npm artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.0 --activate

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="$(tr -d '[:space:]' < .gitleaks-version)"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:package
      - run: pnpm audit:prod

  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: [verify-tag, verify-package]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Enable package managers
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          npm install --global npm@11.19.0

      - run: pnpm install --frozen-lockfile
      - run: npm publish --access public --provenance

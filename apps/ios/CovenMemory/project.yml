name: CovenMemory
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: ai.opencoven.memory
    GENERATE_INFOPLIST_FILE: false
    CODE_SIGN_ENTITLEMENTS: Config/CovenMemory.entitlements
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: CovenAccent
targets:
  CovenMemory:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_NAME: CovenMemory
        PRODUCT_MODULE_NAME: CovenMemory
  CovenMemoryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CovenMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencoven.memory.tests
        GENERATE_INFOPLIST_FILE: true
  CovenMemoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: CovenMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencoven.memory.uitests
        GENERATE_INFOPLIST_FILE: true
schemes:
  CovenMemory:
    build:
      targets:
        CovenMemory: all
        CovenMemoryTests: [test]
        CovenMemoryUITests: [test]
    test:
      targets:
        - CovenMemoryTests
        - CovenMemoryUITests
